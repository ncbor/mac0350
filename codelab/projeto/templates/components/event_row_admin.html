<tr id="event-row-{{ event.id }}" class="admin-event-row" data-group-id="{{ event.group_id }}">
    <td>{{ event.date | datetime }}</td>
    <td>{{ event.group.name if event.group else '-' }}</td>
    <td><strong>{{ event.title }}</strong></td>
    <td>{{ event.location }}</td>
    <td>{{ event.description }}</td>
    <td>
        <button class="btn btn-outline" 
                hx-get="/events/{{ event.id }}/edit" 
                hx-target="#event-row-{{ event.id }}" 
                hx-swap="outerHTML">
            Editar
        </button>
        <button class="btn btn-danger" 
                hx-delete="/events/{{ event.id }}" 
                hx-target="#event-row-{{ event.id }}" 
                hx-swap="outerHTML" 
                hx-confirm="Deletar este evento?">
            Deletar
        </button>
    </td>
</tr>

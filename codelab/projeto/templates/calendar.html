{% extends "base.html" %}

{% block content %}
<h1>Calendário Unificado</h1>
<p class="subtitle">Acompanhe todos os eventos e administre sua agenda.</p>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Data</th>
                <th>Grupo</th>
                <th>Evento</th>
                <th>Descrição</th>
            </tr>
        </thead>
        <tbody id="events-tbody">
            {% for event in events %}
                {% include "components/event_row.html" %}
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}

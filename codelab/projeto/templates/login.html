{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 2rem auto; padding: 2rem;">
    <h2>Login de Administrador</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Usuário</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="password">Senha</label>
            <input type="password" id="password" name="password" required>
        </div>

        <button type="submit" class="btn">Entrar</button>
        <p id="error-msg" style="color: var(--danger); margin-top: 1rem; display: none;">Credenciais inválidas</p>
    </form>
</div>
<script>
    // Lógica de login simples
    document.getElementById('login-form').onsubmit = async (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);

        const resp = await fetch('/token', { method: 'POST', body: fd });

        if (resp.ok) {
            const data = await resp.json();
            localStorage.setItem('token', data.access_token);
            window.location.href = '/admin';
        } else {
            document.getElementById('error-msg').style.display = 'block';
        }
    };
</script>
{% endblock %}
